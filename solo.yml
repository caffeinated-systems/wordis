# Visit https://soloterm.com to learn more
name: wordle
icon: public/favicon.ico
processes:
  Serve:
    command: php artisan serve
    working_dir: null
    auto_start: true
    auto_restart: true
    restart_when_changed: []
    env: {}
  npm:dev:
    command: npm run dev
    working_dir: null
    auto_start: true
    auto_restart: false
    restart_when_changed: []
    env: {}
  Logs:
    command: php artisan pail --timeout=0
    working_dir: null
    auto_start: false
    auto_restart: false
    restart_when_changed: []
    env: {}
  Queue:
    command: php artisan queue:listen --tries=1 --timeout=0
    working_dir: null
    auto_start: false
    auto_restart: true
    restart_when_changed: []
    env: {}
